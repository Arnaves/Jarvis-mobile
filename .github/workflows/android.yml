name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads android-all jars from Maven Central at test time; cache them so a
      # transient network blip doesn't fail every Robolectric test.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-android-all-

      - name: Unit tests + UI screenshots (Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Bundle offline wake-word model (Vosk, ~40 MB)
        run: |
          curl -fsSL -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          mkdir -p /tmp/vosk && unzip -q /tmp/vosk.zip -d /tmp/vosk
          rm -rf app/src/main/assets/vosk-model && mkdir -p app/src/main/assets
          mv /tmp/vosk/vosk-model-small-en-us-0.15 app/src/main/assets/vosk-model

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apks
          path: app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: app/screenshots/*.png

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

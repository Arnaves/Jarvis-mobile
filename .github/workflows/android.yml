name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the "latest" release with a direct APK download

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests + UI screenshots (Robolectric)
        run: ./gradlew --init-script .github/ci/maven-mirror.gradle testDebugUnitTest --stacktrace

      - name: Bundle offline wake-word model (Vosk, ~40 MB)
        run: |
          curl -fsSL -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          mkdir -p /tmp/vosk && unzip -q /tmp/vosk.zip -d /tmp/vosk
          rm -rf app/src/main/assets/vosk-model && mkdir -p app/src/main/assets
          mv /tmp/vosk/vosk-model-small-en-us-0.15 app/src/main/assets/vosk-model

      - name: Build APKs
        run: ./gradlew --init-script .github/ci/maven-mirror.gradle assembleDebug assembleRelease --stacktrace

      # Direct phone download: Releases › "JARVIS latest" › JARVIS.apk (no sign-in, no zip).
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk JARVIS.apk
          gh release delete jarvis-latest --yes --cleanup-tag || true
          gh release create jarvis-latest JARVIS.apk \
            --target "$GITHUB_SHA" --prerelease --title "JARVIS (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On your phone: tap JARVIS.apk below to download, then open it to install (allow installs from your browser if asked)."

      - uses: actions/upload-artifact@v6
        with:
          name: jarvis-apks
          path: app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-screenshots
          path: app/screenshots/*.png

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

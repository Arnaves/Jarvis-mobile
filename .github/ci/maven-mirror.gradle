// CI only: try Google's public Maven Central mirror first; Maven Central rate-limits CI runners (HTTP 429).
settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.repositories.with {
        add(0, maven { url "https://maven-central.storage-download.googleapis.com/maven2" })
    }
    settings.pluginManagement.repositories.with {
        add(0, maven { url "https://maven-central.storage-download.googleapis.com/maven2" })
    }
}
